<!doctype html>
<html lang="pt-BR">
  {% if current_user.is_authenticated %}
  <head>
    <meta charset="UTF-8" />
    <title>Assistente IA - SIAB</title>
  </head>
  <body>
    <h2>🤖 Assistente IA - SIAB</h2>

    <form method="POST">
      <textarea
        name="pergunta"
        rows="4"
        cols="70"
        placeholder="Faça uma pergunta..."
        required
      ></textarea>

      <br /><br />

      <button type="submit">Perguntar</button>
    </form>

    {% if resposta %}

    <hr />

    <h3>Resposta</h3>

    <p>{{ resposta }}</p>

    {% endif %}
  </body>
  {% endif %}
</html>
